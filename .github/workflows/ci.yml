name: TraceForge verification
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check traceforge tests scripts
      - run: python -m pytest -q
      - run: python -m traceforge evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: .traceforge/evaluation.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  installed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv .wheel-smoke
      - run: .wheel-smoke/bin/python -m pip install dist/*.whl
      - run: python scripts/smoke_release.py --python .wheel-smoke/bin/python --report release-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-release
          path: |
            dist/*
            release-report.json
